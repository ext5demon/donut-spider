name: Regression tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host-tests:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        sanitizers: [OFF, ON]
    steps:
      - uses: actions/checkout@v4
      - name: Install test dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build gcc pkg-config libsdl2-dev libglfw3-dev libbz2-dev xvfb xauth
      - name: Build and run 26 regressions
        env:
          SANITIZE: ${{ matrix.sanitizers }}
        run: bash tools/test-host.sh
